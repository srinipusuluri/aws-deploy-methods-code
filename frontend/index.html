<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Chatbot</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header><b>Claude Chatbot</b><span id="level"></span><span class="grow"></span><button id="login" hidden>Sign in</button><button id="logout" hidden>Sign out</button></header>
<div class="shell">
  <aside id="side" hidden><button id="new">+ New chat</button><ul id="chats"></ul></aside>
  <main><div id="log" aria-live="polite"></div>
    <form id="form"><textarea id="box" rows="2" maxlength="4000" placeholder="Ask something..." required></textarea><button id="send">Send</button></form>
    <p id="err" role="alert"></p></main>
</div>
<script src="config.js"></script><script src="auth.js"></script><script src="app.js"></script>
</body></html>
