AWSTemplateFormatVersion: '2010-09-09'
Description: Static site (private S3 + CloudFront OAC). Optionally fronts the API at /api/* so one WAF covers both.

Parameters:
  ApiDomain:
    Type: String
    Default: ''
    Description: 'API host only, e.g. abc123.execute-api.us-east-1.amazonaws.com. Leave empty to skip the /api route.'
  WebAclArn:
    Type: String
    Default: ''
    Description: 'Optional WAFv2 web ACL ARN (scope CLOUDFRONT, created in us-east-1). Leave empty to add it later.'

Conditions:
  HasApi: !Not [!Equals [!Ref ApiDomain, '']]
  HasWaf: !Not [!Equals [!Ref WebAclArn, '']]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
  OAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  StripApiPrefix:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-strip-api
      AutoPublish: true
      FunctionConfig: {Comment: Remove the /api prefix before the request reaches API Gateway, Runtime: cloudfront-js-2.0}
      FunctionCode: |
        function handler(event) {
          var r = event.request;
          r.uri = r.uri.replace(/^\/api/, '') || '/';
          return r;
        }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        WebACLId: !If [HasWaf, !Ref WebAclArn, !Ref 'AWS::NoValue']
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OAC.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
          - !If
            - HasApi
            - Id: api
              DomainName: !Ref ApiDomain
              CustomOriginConfig: {OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2]}
            - !Ref 'AWS::NoValue'
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
        CacheBehaviors:
          - !If
            - HasApi
            - PathPattern: /api/*
              TargetOriginId: api
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad            # Managed-CachingDisabled
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac    # Managed-AllViewerExceptHostHeader
              FunctionAssociations: [{EventType: viewer-request, FunctionARN: !GetAtt StripApiPrefix.FunctionMetadata.FunctionARN}]
            - !Ref 'AWS::NoValue'
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  SiteUrl:
    Value: !Sub https://${Distribution.DomainName}
