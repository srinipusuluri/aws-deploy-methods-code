AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Claude chatbot - Level 6 (quotas, async jobs, DLQ, alarms)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 25            # keep below the ~30 s API Gateway integration limit
    MemorySize: 512
    Architectures: [arm64]
    Tracing: Active

Parameters:
  AnthropicSecretArn:
    Type: String
    Description: 'ARN of the Secrets Manager secret holding a JSON object with key api_key' 
  ClaudeModel:
    Type: String
    Description: A currently supported Anthropic model ID (check the Anthropic docs)
  AllowedOrigin:
    Type: String
    Default: http://localhost:8080
    Description: Exact origin of the website (scheme + host, no trailing slash)
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique prefix for the Cognito Hosted UI domain
  CallbackUrl:
    Type: String
    Default: http://localhost:8080/
    Description: Where Cognito redirects after login (must match the site URL exactly)
  AlertEmail:
    Type: String
    Description: Email that receives alarm notifications (confirm the SNS subscription)
  DailyLimit:
    Type: Number
    Default: 100
    Description: Max chat requests per user per day

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true        # invite-only; users cannot self-register
      Policies:
        PasswordPolicy: {MinimumLength: 12, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: false}
      Schema:
        - Name: tenant_id
          AttributeDataType: String
          Mutable: true
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Ref CallbackUrl]
      LogoutURLs: [!Ref CallbackUrl]
      ReadAttributes: [email, custom:tenant_id]
      WriteAttributes: [email]                # users can never set their own tenant

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowHeaders: [content-type, authorization, idempotency-key]
        AllowMethods: [GET, POST, DELETE, OPTIONS]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      Auth:
        DefaultAuthorizer: Jwt
        Authorizers:
          Jwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  MessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  QuotaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TimeToLiveSpecification: {AttributeName: expires, Enabled: true}

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TimeToLiveSpecification: {AttributeName: expires, Enabled: true}

  JobsDlq:
    Type: AWS::SQS::Queue
    Properties: {MessageRetentionPeriod: 1209600}
  JobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 720                   # 6x the worker timeout (AWS guidance)
      RedrivePolicy: {deadLetterTargetArn: !GetAtt JobsDlq.Arn, maxReceiveCount: 3}
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription: [{Protocol: email, Endpoint: !Ref AlertEmail}]
  DlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Messages are stuck in the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt JobsDlq.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertTopic]
  ChatErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Chat Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref ChatFn}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  ApiServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API 5xx responses
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{Name: ApiId, Value: !Ref Api}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  ChatFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: level3_chat.handler.lambda_handler
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          ANTHROPIC_SECRET_ARN: !Ref AnthropicSecretArn
          CLAUDE_MODEL: !Ref ClaudeModel
          LOG_LEVEL: INFO
          SESSIONS_TABLE: !Ref SessionsTable
          MESSAGES_TABLE: !Ref MessagesTable
          QUOTA_TABLE: !Ref QuotaTable
          DAILY_LIMIT: !Ref DailyLimit
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref AnthropicSecretArn
        - DynamoDBCrudPolicy: {TableName: !Ref SessionsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref MessagesTable}
        - DynamoDBCrudPolicy: {TableName: !Ref QuotaTable}
      Events:
        Chat:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/chat", Method: POST}
        List:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/chats", Method: GET}
        Get:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/chats/{chatId}", Method: GET}
        Del:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/chats/{chatId}", Method: DELETE}

  JobsFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: level6_scale.jobs.lambda_handler
      Environment:
        Variables:
          ANTHROPIC_SECRET_ARN: !Ref AnthropicSecretArn
          CLAUDE_MODEL: !Ref ClaudeModel
          LOG_LEVEL: INFO
          JOBS_TABLE: !Ref JobsTable
          QUEUE_URL: !Ref JobsQueue
          QUOTA_TABLE: !Ref QuotaTable
          DAILY_LIMIT: !Ref DailyLimit
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref AnthropicSecretArn
        - DynamoDBCrudPolicy: {TableName: !Ref JobsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref QuotaTable}
        - SQSSendMessagePolicy: {QueueName: !GetAtt JobsQueue.QueueName}
      Events:
        Create:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/jobs", Method: POST}
        Get:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/jobs/{jobId}", Method: GET}

  WorkerFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: level6_scale.worker.lambda_handler
      Timeout: 120
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          ANTHROPIC_SECRET_ARN: !Ref AnthropicSecretArn
          CLAUDE_MODEL: !Ref ClaudeModel
          LOG_LEVEL: INFO
          JOBS_TABLE: !Ref JobsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref AnthropicSecretArn
        - DynamoDBCrudPolicy: {TableName: !Ref JobsTable}
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt JobsQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Value: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
  AlertTopicArn:
    Value: !Ref AlertTopic
